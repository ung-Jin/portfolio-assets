<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { --ink:#2B2D31; --blue:#5F7388; --blue-l:#DDE4EB; --paper:#FFFFFF; }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { width:1920px; height:860px; background:var(--paper); }
  body { font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif; color:var(--ink); position:relative; overflow:hidden }
  .serif { font-family:'Noto Serif CJK KR','Noto Serif KR',serif }

  /* 사진 칸 (나중에 사진으로 교체) */
  .photo { position:absolute; left:72px; top:96px; width:420px; height:560px; background:#EEF1F4; border:1px solid var(--blue-l); overflow:hidden }
  .photo img { width:100%; height:100%; object-fit:cover; display:block }
  .photo .ph { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--blue) }
  .photo .ph i { display:block; width:96px; height:96px; border-radius:50%; border:2px solid #C3CDD7 }
  .photo .ph b { display:block; width:170px; height:86px; border-radius:86px 86px 0 0; border:2px solid #C3CDD7; border-bottom:none; margin-top:-4px }
  .photo .ph span { margin-top:18px; font-size:16px; letter-spacing:.32em; font-weight:700 }

  /* 이름·소개 */
  .dash { position:absolute; left:556px; top:110px; width:44px; height:6px; background:var(--ink) }
  .eyebrow { position:absolute; left:624px; top:98px; font-size:22px; letter-spacing:.38em; font-weight:700 }
  .name { position:absolute; left:548px; top:150px; font-size:200px; line-height:1; font-weight:900; letter-spacing:-.045em }
  .role { position:absolute; left:556px; top:384px; font-size:42px; font-style:italic; color:var(--blue); letter-spacing:.01em }
  .rule { position:absolute; left:556px; top:456px; width:620px; height:2px; background:var(--ink) }
  .head { position:absolute; left:556px; top:486px; width:640px; font-size:33px; line-height:1.4; font-weight:800; letter-spacing:-.02em }
  .intro { position:absolute; left:556px; top:548px; width:620px; font-size:23px; line-height:1.7; color:rgba(43,45,49,.8); word-break:keep-all }

  /* 하단 띠 */
  .foot { position:absolute; left:72px; right:0; bottom:0; height:76px; }
  .foot .line { position:absolute; left:0; width:1168px; top:0; height:1px; background:rgba(43,45,49,.28) }
  .foot .tab { position:absolute; left:0; top:-1px; height:44px; width:170px; background:var(--ink); color:#fff; font-size:20px; letter-spacing:.14em; font-weight:500; display:flex; align-items:center; justify-content:center }

  /* 오른쪽 차콜 블록 */
  .panel { position:absolute; left:1240px; top:0; width:680px; height:860px; background:var(--ink); color:#fff }
  .panel .tag { position:absolute; left:80px; top:84px; width:56px; height:6px; background:var(--blue) }
  .panel .vert { position:absolute; right:40px; top:84px; writing-mode:vertical-rl; font-size:17px; letter-spacing:.42em; color:rgba(255,255,255,.55); font-weight:500 }
  .stat { position:absolute; left:80px; right:120px; border-top:1px solid rgba(255,255,255,.22); padding-top:18px }
  .stat .n { font-size:104px; line-height:1; font-weight:300; letter-spacing:-.02em }
  .stat .n small { font-size:38px; margin-left:8px; color:var(--blue-l) }
  .stat .l { margin-top:8px; font-size:20px; letter-spacing:.2em; font-weight:500; color:rgba(255,255,255,.88) }
  .stat .s { margin-top:4px; font-size:18px; color:rgba(255,255,255,.55) }
</style></head>
<body>
  <div class="photo">__PHOTO__</div>

  <div class="dash"></div>
  <div class="eyebrow">PORTFOLIO</div>
  <div class="name">이웅진</div>
  <div class="role serif">Full-Stack Developer</div>
  <div class="rule"></div>
  <div class="head">좋아 보이는 결과일수록 한 번 더 확인합니다.</div>
  <div class="intro">점수가 좋은 이유를 따져 데이터 누수를 찾았고, 평균에 묻힌 강원도 오차를 지역별로 나눠 추적했습니다.</div>

  <div class="panel">
    <div class="tag"></div>
    <div class="vert">PORTFOLIO &nbsp;·&nbsp; 2026</div>
    <div class="stat" style="top:150px"><div class="n serif">3<small>팀</small></div><div class="l">TEAM PROJECTS</div><div class="s">세 프로젝트 모두 팀장</div></div>
    <div class="stat" style="top:372px"><div class="n serif">8</div><div class="l">TROUBLESHOOTING</div><div class="s">막힌 문제와 해결 과정</div></div>
    <div class="stat" style="top:594px"><div class="n serif">36<small>+</small></div><div class="l">WORK LOGS</div><div class="s">작업일지</div></div>
  </div>

  <div class="foot">
    <div class="line"></div>
    <div class="tab">Portfolio</div>
  </div>
</body></html>
