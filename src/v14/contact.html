<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연락처</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* 이미지들과 같은 기준: 1920 폭 기준 좌우 72px = 3.75% */
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2B2D31;padding:6px 3.75vw;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:4.2vw}
.tile{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-top:1px solid #2B2D31;border-bottom:1px solid #2B2D31;padding:max(10px,1.05vw) 0;color:inherit;text-decoration:none}
.l{font-size:max(10px,.95vw);letter-spacing:.24em;font-weight:700;color:#5F7388;line-height:1.3}
.v{margin-top:max(2px,.3vw);font-size:max(16px,1.75vw);font-weight:700;letter-spacing:-.005em;line-height:1.3;white-space:nowrap}
.email .v{user-select:all;-webkit-user-select:all;cursor:text}
.b{flex:none;width:max(34px,3.3vw);height:max(34px,3.3vw);border-radius:50%;background:#2B2D31;color:#fff;border:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.b svg{width:42%;height:42%}
.tile:hover .b,.b:hover{background:#5F7388}
.ok{color:#2B2D31}
@media (max-width:640px){
  body{padding:6px 0}
  .row{flex-direction:column;gap:0}
  .row .tile+.tile{border-top:0}
}
</style>
</head>
<body>
<div class="row">
  <div class="tile email">
    <div>
      <div class="l" id="el">EMAIL</div>
      <div class="v" id="ev">leeungjin@gmail.com</div>
    </div>
    <button class="b" id="cp" type="button" aria-label="이메일 주소 복사" title="복사">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5"/><path d="M15.5 8.5V5.5a1 1 0 0 0-1-1h-9a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3"/></svg>
    </button>
  </div>
  <a class="tile" href="https://github.com/ung-Jin" target="_blank" rel="noopener">
    <div>
      <div class="l">GITHUB</div>
      <div class="v">github.com/ung-Jin</div>
    </div>
    <span class="b" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8.5 7H17v8.5"/></svg>
    </span>
  </a>
</div>
<script>
(function(){
  var btn=document.getElementById('cp'),lab=document.getElementById('el'),val=document.getElementById('ev'),t;
  function done(msg){lab.textContent='EMAIL · '+msg;lab.classList.add('ok');clearTimeout(t);t=setTimeout(function(){lab.textContent='EMAIL';lab.classList.remove('ok')},1600)}
  function selectIt(){var r=document.createRange();r.selectNodeContents(val);var s=getSelection();s.removeAllRanges();s.addRange(r)}
  btn.addEventListener('click',function(){
    var text=val.textContent;
    function fallback(){selectIt();var ok=false;try{ok=document.execCommand('copy')}catch(e){}done(ok?'복사됨':'Ctrl+C로 복사')}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done('복사됨')},fallback)}else{fallback()}
  });
})();
</script>
</body>
</html>
